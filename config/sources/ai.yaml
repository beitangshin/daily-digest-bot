# 「AI 行业日报」信息源 — 目标 20+ 个活跃源
# 来源分布：北美 ≥12 · 中国 ≥4 · 欧洲/其他 ≥4
# 加完跑 daily-digest sources check --channel ai 验证

sources:
  # ========== 北美（美国/加拿大）==========
  - name: "TechCrunch AI"
    type: rss
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    category: "海外科技媒体"
    enabled: true

  - name: "The Verge AI"
    type: rss
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    category: "海外科技媒体"
    enabled: true

  - name: "VentureBeat"
    type: rss
    url: "https://venturebeat.com/feed/"
    category: "海外科技媒体"
    enabled: true

  - name: "MIT Technology Review"
    type: rss
    url: "https://www.technologyreview.com/feed/"
    category: "权威研究媒体"
    enabled: true

  - name: "Wired AI"
    type: rss
    url: "https://www.wired.com/feed/tag/ai/latest/rss"
    category: "海外科技媒体"
    enabled: true

  # 原来的 URL 是 "technology-lab" 综合科技板块（不限 AI），换成真正的 AI
  # 专栏 feed（curl 验证过：标题就是 "AI - Ars Technica"）。
  - name: "Ars Technica AI"
    type: rss
    url: "https://arstechnica.com/ai/feed/"
    category: "海外科技媒体"
    enabled: true

  - name: "MarkTechPost"
    type: rss
    url: "https://www.marktechpost.com/feed/"
    category: "海外科技媒体"
    enabled: true

  - name: "OpenAI Blog"
    type: rss
    url: "https://openai.com/news/rss.xml"
    category: "厂商官方博客"
    enabled: true

  - name: "Anthropic Blog"
    type: rss
    url: "https://www.anthropic.com/feed.xml"
    category: "厂商官方博客"
    enabled: true

  - name: "Hugging Face Blog"
    type: rss
    url: "https://huggingface.co/blog/feed.xml"
    category: "厂商官方博客"
    enabled: true

  - name: "NVIDIA Blog"
    type: rss
    url: "https://blogs.nvidia.com/feed/"
    category: "厂商官方博客"
    enabled: true

  - name: "arXiv AI"
    type: rss
    url: "https://rss.arxiv.org/rss/cs.AI"
    category: "学术论文"
    enabled: false  # 用户明确不要论文，只要行业资讯

  # 原来是 hnrss.org/frontpage（整个 HN 首页，什么都有），换成按关键词过滤
  # 的版本，只保留首页里跟 AI 相关的条目——测过 hnrss 支持 q= 参数生效。
  - name: "Hacker News"
    type: rss
    url: "https://hnrss.org/frontpage?q=AI"
    category: "综合科技"
    enabled: true

  - name: "Google DeepMind Blog"
    type: rss
    url: "https://deepmind.google/blog/rss.xml"
    category: "厂商官方博客"
    enabled: true

  # ========== 中国 ==========
  - name: "量子位"
    type: rss
    url: "https://www.qbitai.com/rss"
    category: "中文科技媒体"
    enabled: true

  - name: "机器之心"
    type: html
    url: "https://www.jiqizhixin.com/"
    category: "中文科技媒体"
    enabled: true

  # 全站资讯 feed，不限 AI；试过 /information/AI/feed 但那是 SPA 页面不是真
  # RSS，没找到可用的窄范围替代，先禁用。
  - name: "36氪"
    type: rss
    url: "https://36kr.com/feed"
    category: "中文科技媒体"
    enabled: false

  # ========== 欧洲/其他 ==========
  # 名字叫 AI，URL 其实是 thenextweb 全站 feed（不限 AI）；试了几个猜测的 AI
  # 专栏/标签 URL 都是 404，没找到可用的窄范围替代，先禁用。
  - name: "TNW AI"
    type: rss
    url: "https://thenextweb.com/feed/"
    category: "欧洲科技媒体"
    enabled: false

  - name: "IEEE Spectrum AI"
    type: rss
    url: "https://spectrum.ieee.org/feeds/artificial-intelligence.rss"
    category: "权威研究媒体"
    enabled: true

  - name: "ScienceDaily AI"
    type: rss
    url: "https://www.sciencedaily.com/rss/computers_math/artificial_intelligence.xml"
    category: "权威研究媒体"
    enabled: true

  - name: "Analytics Vidhya"
    type: rss
    url: "https://www.analyticsvidhya.com/blog/feed/"
    category: "海外科技媒体"
    enabled: true

  - name: "Unite.AI"
    type: rss
    url: "https://www.unite.ai/feed/"
    category: "海外科技媒体"
    enabled: true
