# 「瑞典房源日报」频道的信息源。
#
# 所有频道统一由 daily-digest run 管理，不需要单独跑脚本。
# 这个频道使用 Booli Playwright 爬虫（type: booli），不需要 RSS 也不需要 API key。
#
# 如果以后想加别的搜索（比如不同城市、不同价格区间），再加一条 source 即可。
#
# 注意：筛选逻辑（楼层、安全等）在 housing_pipeline.py 中配置，
# 不是在这里配置。

sources:
  - name: "Booli - Stockholm"
    url: "https://www.booli.se/sok/till-salu?typ=villa,bostadsrätt,lägenhet,radhus,parhus&pris_max=9500000&sort=pubdate_desc"
    type: booli
    category: "在售房源"
    enabled: true
